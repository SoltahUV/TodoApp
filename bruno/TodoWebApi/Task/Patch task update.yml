info:
  name: Patch task update
  type: http
  seq: 5
  docs: |-
    Частичное обновление: любое поле можно не передавать.
    null или отсутствие поля = «не менять».
    Пустая строка "" в name недопустима (400).

http:
  method: PATCH
  url: http://{{IP}}:{{Port}}/api/Tasks/{{taskId}}
  body:
    type: json
    data: |-
      {
        "name": "Test patch task update",
        "description": "Test patch description update",
        "status": 2
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
