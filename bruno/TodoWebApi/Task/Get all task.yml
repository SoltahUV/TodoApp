info:
  name: Get all task
  type: http
  seq: 1

http:
  method: GET
  url: http://{{IP}}:{{Port}}/Task
  body:
    type: json
    data: ""
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const tasks = res.body;
        if (Array.isArray(tasks) && tasks.length > 0) {
          const random = tasks[Math.floor(Math.random() * tasks.length)];
          bru.setEnvVar("taskId", random.itemId);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
