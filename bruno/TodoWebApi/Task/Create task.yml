info:
  name: Create task
  type: http
  seq: 3

http:
  method: POST
  url: http://{{IP}}:{{Port}}/Task
  body:
    type: json
    data: |-
      {
        "name" : "Test task",
        "description" : "Test description"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
