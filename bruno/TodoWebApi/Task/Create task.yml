info:
  name: Create task
  type: http
  seq: 1

http:
  method: POST
  url: http://{{IP}}:{{Port}}/api/Tasks
  body:
    type: json
    data: |-
      {
        "name": "Test task",
        "description": "Test description"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
