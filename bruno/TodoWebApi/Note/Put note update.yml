info:
  name: Put note update
  type: http
  seq: 4
  docs: |-
    Полная замена: обязателен name.
    Если text не передан или null — текст очищается.

http:
  method: PUT
  url: http://{{IP}}:{{Port}}/api/Notes/{{noteId}}
  body:
    type: json
    data: |-
      {
        "name": "Test put note update",
        "text": "Test put text update"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
