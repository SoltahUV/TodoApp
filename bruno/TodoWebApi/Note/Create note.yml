info:
  name: Create note
  type: http
  seq: 1

http:
  method: POST
  url: http://{{IP}}:{{Port}}/api/Notes
  body:
    type: json
    data: |-
      {
        "name": "Test note",
        "text": "Test text"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
