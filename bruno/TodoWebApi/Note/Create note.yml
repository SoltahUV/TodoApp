info:
  name: Create note
  type: http
  seq: 3

http:
  method: POST
  url: http://{{IP}}:{{Port}}/Note
  body:
    type: json
    data: |-
      {
        "name" : "Test note",
        "text" : "Test text"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
