info:
  name: Patch note update
  type: http
  seq: 5
  docs: |-
    Частичное обновление: любое поле можно не передавать.
    null или отсутствие поля = «не менять».
    Пустая строка "" в name недопустима (400).

http:
  method: PATCH
  url: http://{{IP}}:{{Port}}/api/Notes/{{noteId}}
  body:
    type: json
    data: |-
      {
        "name": "Test patch note update",
        "text": "Test patch text update"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
