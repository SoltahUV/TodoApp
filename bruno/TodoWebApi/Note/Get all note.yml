info:
  name: Get all note
  type: http
  seq: 2

http:
  method: GET
  url: http://{{IP}}:{{Port}}/api/Notes
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const items = res.body;
        if (Array.isArray(items) && items.length > 0) {
          bru.setEnvVar("noteId", items[0].itemId);
        } else {
          console.error("No notes found: create one first");
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
