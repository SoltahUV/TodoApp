info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: http://{{IP}}:{{Port}}/auth/login
  body:
    type: json
    data: |-
      {
        "name": "{{username}}",
        "password": "{{password}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const body = res.body;
        if (body && body.token) {
          bru.setEnvVar("token", body.token);
        } else {
          console.error("Login failed: " + res.status);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
